<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400"
            height="400"></canvas>
    <p id="info"></p>
    <button id="restartButton">Restart</button>


    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;
        let snakecolor= "black";

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = snakecolor;
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        const restartGame = () => {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            food = { x: 15, y: 15 };
            score = 0;
            gameOver=0;
            document.getElementById("info").innerText = "Score: " + score;
            clearInterval(gameTimer);
            drawGame();
            startGame();        
        }


        const movesnake = () => {
            const headx=snake[0].x
            const heady=snake[0].y

            const newHead = {
                x : headx + direction.x,
                y : heady + direction.y
            }
            const collision =
                newHead.x < 0 ||
                newHead.x >= tileCount ||
                newHead.y < 0 ||
                newHead.y >= tileCount ||
                snake.some(segment => segment.x === newHead.x &&
                      segment.y === newHead.y)

            if (collision) {
                document.getElementById("info").innerText =
                     "Game Over! Final Score: " + score;
                clearInterval(gameTimer);
                return;
            }
            
            snake.unshift(newHead)
            document.getElementById("info").innerText = "Score: " + score
            
            if (newHead.x === food.x && newHead.y === food.y)  {
                score++
                if (score>5) {
                    snakecolor = "green";
                }
                if (score>10) {
                    snakecolor = "orange";
                }
                if (score>15) {
                    snakecolor = "red";
                }
                if (score>20) {
                    snakecolor = "purple";
                }
                document.getElementById("info").innerText = "Score: " + score
                
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                while (snake.some(segment => segment.x === food.x && segment.y === food.y)) {
                    // If the new food position is on the snake, generate a new one
                    food = {
                        x: Math.floor(Math.random()*tileCount),
                        y: Math.floor(Math.random()*tileCount)
                    };
                }
                
            }
            else {
                snake.pop();
            }
        }
        let gameTimer;
        const startGame = () => {
            clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                movesnake();
                drawGame();
            }, 150);
};

        startGame();

        document.getElementById("restartButton")
            .addEventListener("click", restartGame);

        document.addEventListener("keydown",(event)=>{
            let newDirection = direction
            switch(event.key){
                case "ArrowUp":
                    newDirection = {x:0,y:-1}
                    break;
                case "ArrowDown": newDirection = {x:0,y:1}
                    break;
                case "ArrowLeft": newDirection = {x:-1,y:0}
                    break;
                case "ArrowRight": newDirection = {x:1,y:0}
                    break;
            }
            if (newDirection.x*direction.x !==-1 && newDirection.y*direction.y !==-1) {
                direction = newDirection
            }
        })

    </script>

</body>
</html>
